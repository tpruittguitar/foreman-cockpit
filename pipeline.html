#view-pipeline.on:has(#drawer.on){grid-template-columns:minmax(0,1fr) clamp(380px,42%,680px)}
#dash{grid-area:1/1;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:auto minmax(0,1fr);padding:8px;gap:8px}
#worksplit{grid-area:2/1;position:relative}
#drawer{grid-column:2;grid-row:1/3;width:auto!important;min-width:0!important;max-width:none!important;position:relative!important;inset:auto!important}
.decide-strip{grid-column:1/8;grid-row:1;display:flex;gap:6px;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;align-items:stretch}.decide-strip::-webkit-scrollbar{display:none}
.decide{flex:1 1 0;min-width:92px;min-height:0;border:1px solid var(--line);background:#0a0a0a;border-radius:6px;padding:5px 9px 4px;display:flex;flex-direction:column;gap:1px;text-align:left;text-transform:none;letter-spacing:0;color:var(--dim);box-shadow:none;transition:border-color 160ms var(--ease),background 160ms var(--ease),transform 160ms var(--ease)}
.decide:hover{border-color:var(--line2);background:#0d0f12;color:var(--dim);transform:translateY(-1px)}
.decide small{font:9.6px var(--mono);letter-spacing:.9px;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.decide b{font:700 19px/1.1 var(--mono);color:#fff}.decide .delta{font:9.6px var(--mono);color:var(--faint);white-space:nowrap}.decide .delta.up{color:var(--ng)}
.decide.warn{border-color:#5a4a1e}.decide.warn b{color:var(--caution)}.decide.on{border-color:var(--white);background:#121417}.decide.on small{color:var(--text)}
.dash-card.w.gaps{grid-column:1/4;grid-row:2}.dash-card.w.actions{grid-column:4/8;grid-row:2}
#job-map-card{grid-column:8/13;grid-row:1/3}
#job-map-card #mapfilters{position:absolute;left:8px;right:8px;top:36px;z-index:3;display:flex;border:0;background:transparent;padding:0;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}#job-map-card #mapfilters::-webkit-scrollbar{display:none}
#job-map-card #mapfilters span{display:none}#job-map-card #mapfilters button{flex:none;margin:0;font:9.6px var(--mono);min-height:22px;padding:2px 6px;background:#080808;border-color:#292929;color:var(--faint)}#job-map-card #mapfilters button:first-of-type{margin-left:auto}#job-map-card #mapfilters button .mono{color:inherit;opacity:.75;margin-left:3px}#job-map-card #mapfilters button.on{background:#efefef;color:#090909;border-color:#efefef}
.job-map{inset:64px 7px 24px}
header #search{flex:0 1 230px;min-width:110px;height:28px;padding:0 9px;background:#000;border:1px solid var(--line2);color:var(--text);font:12px var(--sans);border-radius:0;-webkit-appearance:none;appearance:none}header #search:focus{outline:none;border-color:var(--focus)}
@media(max-width:980px){#job-map-card{grid-column:8/13;grid-row:1/3}#dash{grid-template-rows:auto minmax(0,1fr)}}
@media(min-width:761px) and (max-width:1180px){#view-pipeline.on:has(#drawer.on) #dash{grid-template-rows:minmax(0,1fr)}#view-pipeline.on:has(#drawer.on) .dash-card.w{display:none}#view-pipeline.on:has(#drawer.on) .decide-strip{grid-column:1/7;grid-row:1}#view-pipeline.on:has(#drawer.on) #job-map-card{grid-column:7/13;grid-row:1}}
@media(max-width:760px), (pointer:coarse) and (max-width:980px){
  #view-pipeline.on{grid-template-columns:minmax(0,1fr) 0px!important}
  #drawer{grid-area:2/1!important;z-index:10}
  #dash{grid-template-rows:auto minmax(0,1fr) minmax(0,1fr);gap:3px;padding:3px}.decide-strip{grid-column:1/-1;grid-row:1;gap:3px}.decide{min-width:78px;padding:3px 6px 2px}.decide b{font-size:13px}.decide small{font-size:8.4px;letter-spacing:0}.decide .delta{display:none}
  .dash-card.w.gaps{grid-column:1/7;grid-row:2}.dash-card.w.actions{grid-column:1/7;grid-row:3}#job-map-card{grid-column:7/13;grid-row:2/4}
  #job-map-card #mapfilters{top:auto;bottom:4px;left:4px;right:118px}#job-map-card #mapfilters button{min-height:26px}.job-map{inset:20px 0 67px}
  body.map-full #job-map-card #mapfilters{top:calc(34px + env(safe-area-inset-top));bottom:auto;right:4px}body.map-full #job-map-card .job-map{inset:calc(66px + env(safe-area-inset-top)) 4px calc(78px + env(safe-area-inset-bottom))!important}
  header #search{order:3;flex:1 1 150px;min-width:140px;height:32px;font-size:16px}#readout{flex:1 1 120px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
@media(max-height:520px){
  #dash{grid-template-rows:minmax(0,1fr);padding:3px;gap:3px}.dash-card.w{display:none}.decide-strip{grid-column:1/8;grid-row:1}.decide{padding:2px 6px;min-width:70px}.decide b{font-size:13px;line-height:1}.decide small{font-size:8.4px;letter-spacing:0}.decide .delta{display:none}
  #job-map-card{grid-column:8/13;grid-row:1}#job-map-card #mapfilters{top:20px}.job-map{inset:44px 2px 2px}
}

/* Job Workspace (PR D): header with chips, prev/next and actions; pills, score badges, posting frame. */
#drawer .dh{flex-direction:column;align-items:stretch;gap:6px;padding:8px 10px 6px}
.wh-top{display:flex;gap:8px;align-items:flex-start}.wh-title{flex:1;min-width:0}.wh-title h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh-nav{display:flex;gap:2px;flex:none}.wh-nav button{min-width:28px;min-height:28px;padding:0 6px;font:16px/1 var(--mono)}.wh-nav button:disabled{opacity:.35}
.wh-chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-height:20px}
.wchip{display:inline-flex;align-items:center;border:1px solid var(--line2);padding:1px 7px;font:10.5px var(--sans);color:var(--text);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}.wchip.faint{color:var(--faint)}
.bpill{display:inline-block;padding:1px 7px;border:1px solid var(--line2);font:10.2px var(--mono);letter-spacing:.4px;color:var(--text);white-space:nowrap;border-radius:2px}
.bpill.b-READY_TO_PURSUE{border-color:var(--ok);color:var(--ok)}.bpill.b-APPLIED{border-color:var(--focus);color:var(--focus)}.bpill.b-TIM_DECISION_REQUIRED{border-color:var(--caution);color:var(--caution)}.bpill.b-BLOCKED{border-color:var(--attn);color:var(--attn)}.bpill.b-SCOUT_INTAKE,.bpill.b-DISCOVERY_LEAD{border-color:var(--new);color:var(--new)}.bpill.b-DECLINED_BY_TIM,.bpill.b-REJECTED_BY_EMPLOYER,.bpill.b-CLOSED_DEAD,.bpill.b-DUPLICATE,.bpill.b-INVALID_DISCOVERY{border-color:var(--line2);color:var(--dim)}
.score-badge{display:inline-block;min-width:26px;text-align:center;padding:1px 5px;font:700 11px var(--mono);border:1px solid var(--line2);color:var(--text);background:#000}.score-badge.strong{border-color:var(--ok);color:var(--ok)}.score-badge.watch{border-color:var(--caution);color:var(--caution)}.score-badge.weak{border-color:var(--line2);color:var(--dim)}.score-badge.nogo{border-color:var(--fault);color:#ff8a8e}
#grid td .rowlink{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;color:var(--dim);border:1px solid transparent}#grid td .rowlink:hover{color:var(--text);border-color:var(--line2)}
.wh-actions{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.wh-actions button{min-height:26px;padding:3px 8px;font-size:10.5px;text-transform:none;letter-spacing:0}.wh-decide{display:inline-flex;gap:0}.wh-decide button{border-radius:0;margin-left:-1px}.wh-decide button:first-child{margin-left:0}
.wh-actions button:disabled{opacity:.45;cursor:not-allowed}
.post-iframe{width:100%;height:min(70vh,640px);border:1px solid var(--line2);background:#fff;margin-top:6px}.snap{white-space:pre-wrap;overflow-wrap:anywhere;font:11.3px/1.5 var(--mono);max-height:320px;overflow:auto;margin:0;color:var(--text)}
@media(max-width:760px), (pointer:coarse) and (max-width:980px){.wh-actions button{min-height:34px}.wh-nav button{min-width:34px;min-height:34px}.wchip{max-width:180px}}

/* Analytics (PR E): telemetry-style cards, chart scope line, Scout new-list. */
.chart-card{background-image:repeating-linear-gradient(0deg,transparent 0 23px,#ffffff05 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,#ffffff05 23px 24px)}
.chart-scope{margin-top:6px!important;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chart-scope button{min-height:24px;padding:2px 8px;font:10.5px var(--mono);letter-spacing:.4px}
.scout-new{margin:12px 16px 0}.scout-new-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}.scout-new-list button{text-align:left;text-transform:none;letter-spacing:0;padding:8px 10px;font-size:12px}.scout-new-list button span{display:block;color:var(--dim);font:10.5px var(--mono);margin-top:3px}
@media(max-width:760px){.scout-new{margin:8px}}

/* Motion and spacing (PR F). 150–250 ms, one easing, honoured reduced-motion. Desktop breathes about 10% more. */
.chip,.decide,.wchip,.bpill,#detail-tabs button,.rail-sub button,#grid tbody tr,.dash-card,.detail-card,.chart-card,.docitem,.scout-new-list button{transition:background-color 160ms var(--ease),border-color 160ms var(--ease),color 160ms var(--ease),box-shadow 160ms var(--ease),opacity 160ms var(--ease)}
.view.on{animation:view-in 180ms var(--ease) both}@keyframes view-in{from{opacity:0}to{opacity:1}}
#drawer.on{animation:ws-in 200ms var(--ease) both}@keyframes ws-in{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
#d-body>*{animation:view-in 160ms var(--ease) both}
.decide:active,.chip:active,button:not(:disabled):active{transform:translateY(1px)}
@media(min-width:981px) and (hover:hover){
  .bar{padding:6px 11px;gap:7px}.chip{padding:3px 8px}#dash{padding:9px;gap:9px}.decide{padding:6px 10px 5px}
  .detail-grid{gap:9px}.detail-card{padding:10px}#drawer .db{padding:9px 11px}#detail-tabs{padding:7px 9px;gap:3px}
  .chart-grid{gap:13px;padding:13px}.chart-intro{padding:20px 18px 0}.panel.rep{margin:13px 16px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;animation-iteration-count:1!important;transition-duration:0s!important;scroll-behavior:auto!important}}
</style>

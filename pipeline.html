<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pipeline Explorer</title>
<style>
:root{--bg:#000;--panel:#0a0a0a;--panel2:#111;--line:#232323;--line2:#343434;--text:#e6e6e6;--dim:#9a9a9a;--faint:#5c5c5c;--white:#fff;--ng:#39ff14;--nc:#00e5ff;--nm:#ff2d75;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:11px/1.35 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line2);border-radius:2px;padding:4px 9px;cursor:pointer;letter-spacing:.4px;text-transform:uppercase;font-size:10px}
button:hover{border-color:var(--white)}button.on{border-color:var(--white);color:var(--white);box-shadow:inset 0 0 0 1px #fff2}
button.neon{border-color:var(--nc);color:var(--nc)}button.danger{border-color:var(--nm);color:var(--nm)}
input[type=text],input[type=date],input[type=number],select,textarea{background:#050505;border:1px solid var(--line2);border-radius:2px;padding:4px 6px;color:var(--text)}
a{color:var(--nc);text-decoration:none}
.mono{font-family:var(--mono)}.dim{color:var(--dim)}.faint{color:var(--faint)}.u{text-transform:uppercase;letter-spacing:1.4px;font-size:9px;color:var(--dim)}
#app{display:flex;flex-direction:column;height:100%}
header{flex:none;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0d0d0d,#050505);background-image:repeating-linear-gradient(0deg,transparent 0 23px,#ffffff08 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,#ffffff08 23px 24px);padding:6px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:3px;font-size:12px;color:var(--white)}.brand small{display:block;font-weight:400;letter-spacing:1px;font-size:9px;color:var(--faint)}
#readout{font-family:var(--mono);font-size:10px;color:var(--dim);flex:1;min-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#readout b{color:var(--white);font-weight:600}#readout .bad{color:var(--nm)}#readout .good{color:var(--ng)}
nav{display:flex;gap:2px}nav button{border-color:transparent;color:var(--dim)}nav button.on{border-color:var(--line2);color:var(--white)}
.bar{flex:none;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:5px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:2px;padding:2px 7px;font-size:10px;color:var(--dim);cursor:pointer;background:#070707}
.chip.on{border-color:var(--white);color:var(--white)}.chip .x{color:var(--faint);margin-left:2px}.chip .x:hover{color:var(--nm)}
#predicate{font-family:var(--mono);font-size:9.5px;color:var(--faint);width:100%}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;overflow:auto}.view.on{display:block}
#gridwrap{position:absolute;inset:0;overflow:auto}
table{border-collapse:separate;border-spacing:0;font-size:11px;min-width:100%}
th,td{border-bottom:1px solid var(--line);border-right:1px solid #161616;padding:3px 7px;text-align:left;vertical-align:top;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis;height:22px}
th{position:sticky;top:0;z-index:3;background:#080808;color:var(--dim);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;user-select:none;border-bottom:1px solid var(--line2)}
th .fx{color:var(--faint);margin-left:4px;font-size:9px}th.sorted{color:var(--white)}th.filtered .fx{color:var(--nc)}
td.sticky,th.sticky{position:sticky;z-index:2;background:#050505}th.sticky{z-index:4}
tbody tr:hover td{background:#0e0e0e}tbody tr.focus td{background:#101416;box-shadow:inset 0 -1px 0 var(--nc)}
tbody tr.seen td{color:#c9c9c9}td.mono{font-family:var(--mono);font-size:10.5px}
.g{font-family:var(--mono);margin-right:4px}.g.new{color:var(--ng)}.g.rule{color:var(--nc)}.g.pend{color:var(--nm)}.g.err{color:var(--nm)}
td.b-READY_TO_PURSUE{color:var(--white)}td.b-APPLIED{color:var(--white)}td.b-DECLINED_BY_TIM,td.b-DUPLICATE,td.b-CLOSED_DEAD,td.b-INVALID_DISCOVERY{color:var(--faint)}td.b-BLOCKED,td.b-TIM_DECISION_REQUIRED{color:var(--nc)}
td.b-SCOUT_INTAKE{color:var(--ng);font-weight:600}td.b-DISCOVERY_LEAD{color:var(--ng);opacity:.75}
.chip.hot{border-color:var(--ng);color:var(--ng)}.sec{border:1px solid var(--line);margin:8px 0;padding:6px 8px}.sec h4{margin:0 0 4px;font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim)}.sec.scout h4{color:var(--ng)}.sec.claude h4{color:#b58cff}.sec.forge h4{color:var(--white)}.sec.tim h4{color:var(--nc)}
.kpi{display:inline-block;min-width:110px;margin:3px 6px 3px 0;padding:4px 8px;border:1px solid var(--line2)}.kpi b{display:block;font-family:var(--mono);font-size:14px;color:var(--white)}.kpi span{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
.panel{border:1px solid var(--line);background:var(--panel);margin:8px;padding:8px 10px;position:relative}
.panel.active::before,.panel.active::after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--white)}
.panel.active::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.panel.active::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.panel h3{margin:0 0 6px;font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);font-weight:600}
.rep table{width:100%}.rep th{position:static;cursor:default}.rep td{white-space:normal}
.kv{display:grid;grid-template-columns:150px 1fr;gap:3px 10px;font-size:10.5px}.kv div:nth-child(odd){color:var(--faint);font-family:var(--mono);font-size:9.5px;text-transform:uppercase}.kv div:nth-child(even){white-space:pre-wrap;word-break:break-word}
#drawer{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:#060606;border-left:1px solid var(--line2);z-index:20;display:none;flex-direction:column}#drawer.on{display:flex}
#drawer .dh{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}#drawer .dh h2{margin:0;font-size:13px;color:var(--white);font-weight:600}#drawer .dh .sub{color:var(--dim);font-size:10px}
#drawer .db{flex:1;overflow:auto;padding:8px 10px}
#drawer .rul{border:1px solid var(--nc);padding:8px;margin-bottom:8px;background:#04090a}#drawer .rul h3{color:var(--nc)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
#pop{position:fixed;z-index:30;background:#0b0b0b;border:1px solid var(--line2);padding:8px;min-width:220px;max-width:320px;max-height:60vh;overflow:auto;display:none;box-shadow:0 8px 30px #000}
#pop label{display:block;font-size:10.5px;padding:2px 0;cursor:pointer}#pop .cnt{color:var(--faint);font-family:var(--mono);float:right}
#autobar{flex:none;border-top:1px solid var(--line);background:var(--panel);padding:4px 10px;font-family:var(--mono);font-size:10px;color:var(--dim);display:flex;gap:14px;align-items:center;overflow:hidden;cursor:pointer;white-space:nowrap}
#autobar b{color:var(--white);font-weight:600}#autobar .t{color:var(--ng)}#autobar .soon{color:var(--nm)}
.tip{color:var(--faint);font-size:9.5px}
.pill{display:inline-block;padding:1px 6px;border:1px solid var(--line2);border-radius:2px;font-family:var(--mono);font-size:9.5px}.pill.ok{border-color:var(--ng);color:var(--ng)}.pill.bad{border-color:var(--nm);color:var(--nm)}
textarea.cfg{width:100%;height:280px;font-family:var(--mono);font-size:10px}
@media (max-width:760px){body{font-size:10.5px}header{padding:3px 6px;gap:6px}.brand{font-size:10px;letter-spacing:2px}.brand small{display:none}nav button,#refresh{padding:2px 6px;font-size:9px}th,td{padding:2px 5px;height:20px;max-width:200px}#readout{font-size:9px;order:5;flex-basis:100%}#drawer{width:100%}.kv{grid-template-columns:110px 1fr}#autobar{font-size:9px;gap:10px;padding:3px 6px}.bar{padding:3px 6px;gap:4px}.chip{padding:1px 5px;font-size:9.5px}#predicate{display:none}#search{width:120px!important}#markseen{padding:2px 6px;font-size:9px}}
@media (max-height:520px){header{padding:3px 6px;gap:6px}.brand{font-size:10px}.brand small{display:none}nav button,#refresh{padding:2px 6px;font-size:9px}#readout{font-size:9px}#predicate{display:none}.bar{padding:3px 6px;gap:4px}.chip{padding:1px 5px;font-size:9.5px}#autobar{padding:2px 6px;font-size:9px}th,td{height:20px;padding:2px 5px}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">PIPELINE EXPLORER<small id="brandsub">canonical master · viewer + Tim rulings</small></div>
  <div id="readout">no data</div>
  <nav>
    <button data-tab="pipeline" class="on">Pipeline</button><button data-tab="reports">Reports</button><button data-tab="quality">Scout quality</button><button data-tab="rules">Rules</button><button data-tab="automations">Automations</button><button data-tab="columns">Columns</button>
  </nav>
  <button id="refresh" class="neon">Refresh</button>
  <button id="settings" title="Writer setup">⚙</button>
</header>
<div class="bar" id="presets"></div>
<div class="bar" id="filters" style="display:none"></div>
<main>
  <div class="view on" id="view-pipeline"><div id="gridwrap"><table id="grid"><thead></thead><tbody></tbody></table></div></div>
  <div class="view" id="view-reports"></div>
  <div class="view" id="view-automations"></div>
  <div class="view" id="view-columns"></div>
  <div class="view" id="view-settings"></div>
  <div class="view" id="view-quality"></div>
  <div class="view" id="view-rules"></div>
  <aside id="drawer"><div class="dh"><div style="flex:1"><h2 id="d-title"></h2><div class="sub" id="d-sub"></div></div><button id="d-close">✕</button></div><div class="db" id="d-body"></div></aside>
</main>
<div id="autobar" title="Automation timers · click to expand"></div>
</div>
<div id="pop"></div>
<script src="pipeline-parser.js"></script>
<script src="pipeline-quality.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')};
var LS={get:function(k,d){try{var v=localStorage.getItem('px.'+k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem('px.'+k,JSON.stringify(v))}catch(e){}}};
var MASTER_FILE_ID='19y5xtspYk3ze_E2uRMcUsK3CNh3tbtCILz-us8YtpDI';
var FIXED=['INV','PRIMARY_ID','COMPANY','TITLE','BUCKET','DISPOSITION','TAGS','REQ','LOCATION','SCOUT_ACTION'];
var COMPUTED=['NEW','TIM_RULING','SECTION','MISMATCH','COMP_MID','CELLS'];
var BUCKET_ORDER_DEFAULT=['SCOUT_INTAKE','DISCOVERY_LEAD','READY_TO_PURSUE','TIM_DECISION_REQUIRED','BLOCKED','MANUAL_RESEARCH','APPLIED','REJECTED_BY_EMPLOYER','DECLINED_BY_TIM','DUPLICATE','CLOSED_DEAD','INVALID_DISCOVERY'];
var PROTECTED=['APPLIED','REJECTED_BY_EMPLOYER'];
var DESK_DEFAULT=['NEW','COMPANY','TITLE','BUCKET','TIM_RULING','DISPOSITION','LOCATION','DATE_ADDED','SALARY_BASE_EST','FLEX','FLOOR_STATUS','REQ','NOTIFICATION_SOURCE','IDENTITY_CONFIDENCE','SCOUT_RUN_ID','TAGS','DECLINE_REASON_CODE','BLOCKER','SECTION'];
var SCOUT_KEYS=['INTAKE_KEY','SCOUT_RUN_ID','DISCOVERED_AT_ET','DISCOVERY_SOURCE','SOURCE_URL','SOURCE_PROVIDER','REQ_ID','IDENTITY_CONFIDENCE','INITIAL_UNKNOWN_FIELDS','POSSIBLE_MATCHES','PAY_POSTED','DEGREE_TEXT','FLEX_HINT','REPORTING_LEVEL','EMPLOYER_DOMAIN_HINT','EMPLOYER_PRIMARY_BUSINESS','SCOUT_NOTES','POSTING_DATE','REMOTE_HYBRID','NEVER_CONSIDER_REVIEW_NEEDED','NEVER_CONSIDER_REASON','NOTIFICATION_SOURCE','DATE_ADDED','SOURCE'];
var TIM_KEYS=['TIM_NOTE','TIM_RULING','TIM_DISPOSITION','DECLINE_REASON_CODE','DECLINE_REASON_CODE_PRIOR','DECLINE_REASON_TEXT','REOPEN_TRIGGER','DUP_OF','INVALID_REASON','RESEARCH_REQUEST','STATE_SOURCE','STATE_UPDATED_AT'];
function keyGroup(k){if(TIM_KEYS.indexOf(k)>=0)return 'tim';if(/^(CLAUDE_|ANALYSIS_|PROPOSED_|RANK_|FIT$|FIT_)/.test(k))return 'claude';if(SCOUT_KEYS.indexOf(k)>=0)return 'scout';return 'forge'}
var PHONE_DEFAULT=['NEW','COMPANY','TITLE','BUCKET','TIM_RULING','DATE_ADDED','SALARY_BASE_EST','LOCATION'];
var DATE_KEYS={DATE_ADDED:1,SALARY_ASOF:1,FLEX_ASOF:1,SALARY_EXPIRES:1,APP_DATE:1};
var MONEY_KEYS={SALARY_BASE_EST:1,COMP_MID:1};
var S={cfg:LS.get('cfg',{url:'',key:''}),master:null,rows:[],text:'',meta:{},preset:'ALL',sort:null,filters:{},seen:LS.get('seen',{}),rulings:LS.get('rulings',{}),cols:LS.get('cols',null),autos:LS.get('autos',null),focus:null,tab:'pipeline',newDays:1,search:'',writePending:{}};
S.cols=S.cols||{desktop:DESK_DEFAULT.slice(),phone:PHONE_DEFAULT.slice(),bucketOrder:BUCKET_ORDER_DEFAULT.slice()};
if(S.cols.bucketOrder.indexOf('SCOUT_INTAKE')<0){S.cols.bucketOrder=['SCOUT_INTAKE','DISCOVERY_LEAD'].concat(S.cols.bucketOrder.filter(function(b){return b!=='SCOUT_INTAKE'&&b!=='DISCOVERY_LEAD'})).concat(['INVALID_DISCOVERY']).filter(function(b,i,a){return a.indexOf(b)===i});LS.set('cols',S.cols)}
S.runs=[];S.rules=null;

/* ---------- data source adapters (read-only; manual refresh only; no polling) ---------- */
function hasWriter(){return !!(S.cfg.url&&S.cfg.key)}
function gsGet(action,extra){var u=S.cfg.url+(S.cfg.url.indexOf('?')<0?'?':'&')+'action='+encodeURIComponent(action)+'&key='+encodeURIComponent(S.cfg.key)+(extra||'');return fetch(u,{redirect:'follow',cache:'no-store'}).then(function(r){return r.json()})}
function gsPost(body){body.key=S.cfg.key;return fetch(S.cfg.url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json()})}
var Source={
  script:function(){return gsGet('master').then(function(j){if(j.ok){j.id=j.id+' via writer script'}return j})},
  netlify:function(){return fetch('/api/master',{cache:'no-store'}).then(function(r){return r.json()})},
  url:function(u){return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(function(t){return{ok:true,id:'(url) '+u,fetchedAt:new Date().toISOString(),bytes:t.length,text:t}})}
};
function load(fromCache){
  var q=new URLSearchParams(location.search);var src=q.get('src');
  readout('<b>fetching…</b>');
  var p=src?Source.url(src):(hasWriter()?Source.script():Source.netlify());
  if(hasWriter()&&!src){syncStateDown();gsGet('runs').then(function(j){if(j.ok){S.runs=j.runs||[];if(S.tab==='quality')renderQuality()}}).catch(function(){});gsGet('rules').then(function(j){if(j.ok){S.rules=j.rules;if(S.tab==='rules')renderRules()}}).catch(function(){})}
  p.then(function(res){
    if(!res.ok){readout('<span class="bad">FETCH FAILED</span> '+esc(res.hint||res.error||('status '+res.status)));var c=LS.get('cache',null);if(c){apply(c.text,c.meta,true)}return}
    var meta={id:res.id,fetchedAt:res.fetchedAt,bytes:res.bytes,modifiedTime:res.modifiedTime||''};LS.set('cache',{text:res.text,meta:meta});apply(res.text,meta,false);
  }).catch(function(e){readout('<span class="bad">FETCH ERROR</span> '+esc(e.message));var c=LS.get('cache',null);if(c)apply(c.text,c.meta,true)});
}
function apply(text,meta,fromCache){
  var m=PipelineParser.parse(text);S.master=m;S.text=text;S.meta=meta||{};S.meta.fromCache=!!fromCache;
  S.rows=m.rows.map(decorate);
  // First visit ever on this device: everything already in the master counts as shown now, except rows added within the NEW window.
  if(!LS.get('baselined',false)){var t=Date.now();S.rows.forEach(function(r){var recent=r.dateAdded&&(t-r.dateAdded.getTime())/864e5<=S.newDays;if(!recent)S.seen[r.id]=t});LS.set('seen',S.seen);LS.set('baselined',true)}
  buildColumnModel();renderPresets();render();renderAutobar();
}
function decorate(r){
  r.id=r.PRIMARY_ID||('INV-'+r.INV);
  var d=PipelineParser.parseDate(r.payload.DATE_ADDED);r.dateAdded=d;r.dateAddedStr=d?d.toISOString().slice(0,10):(r.payload.DATE_ADDED||'');
  var mm=PipelineParser.parseMoney(r.payload.SALARY_BASE_EST);r.compMid=mm?mm.mid:null;
  r.mismatch=!!(r.section&&r.BUCKET&&r.section!==r.BUCKET);
  return r;
}
function isNew(r){if(S.seen[r.id])return false;if(r.dateAdded){var age=(Date.now()-r.dateAdded.getTime())/864e5;if(age<=S.newDays)return true}return !S.seen[r.id]}
function ruling(r){return S.rulings[r.id]||null}
var EXPECT_BUCKET={DECLINE:'DECLINED_BY_TIM',APPLIED:'APPLIED',MANUAL_RESEARCH:'MANUAL_RESEARCH',DUPLICATE:'DUPLICATE',CLOSED_DEAD:'CLOSED_DEAD',INVALID_DISCOVERY:'INVALID_DISCOVERY'};
function rulingState(r){var ru=ruling(r);if(!ru)return null;if(ru.receipt&&ru.receipt.COMPLETION_STATUS==='COMPLETE')return{s:'CANONICAL',ru:ru};if(ru.error)return{s:'WRITE FAILED',ru:ru};var changed=ru.snap&&(ru.snap.BUCKET!==r.BUCKET||ru.snap.DISPOSITION!==r.DISPOSITION);if(!changed)return{s:'PENDING',ru:ru};
  var exp=ru.kind==='APPLY_NOW'?(ru.value==='YES'?'READY_TO_PURSUE':'DECLINED_BY_TIM'):EXPECT_BUCKET[ru.kind];var applied=(ru.kind==='NOTE')||(exp&&r.BUCKET===exp);
  return{s:applied?'CANONICAL':'MASTER CHANGED',ru:ru}}
function val(r,c){
  switch(c){
    case 'NEW':return isNew(r)?'NEW':'';
    case 'TIM_RULING':var st=rulingState(r);return st?(st.ru.kind+(st.ru.value?':'+st.ru.value:'')+' ('+st.s.toLowerCase()+')'):'';
    case 'SECTION':return r.section||'';
    case 'MISMATCH':return r.mismatch?'YES':'';
    case 'COMP_MID':return r.compMid!=null?String(r.compMid):'';
    case 'CELLS':return String(r.cellCount);
    case 'DATE_ADDED':return r.dateAddedStr;
  }
  if(FIXED.indexOf(c)>=0)return r[c]||'';
  return r.payload[c]!==undefined?r.payload[c]:'';
}
/* ---------- cross-device state via the writer script (seen + rulings) ---------- */
var syncTimer=null;
function syncStateDown(){gsGet('state').then(function(j){if(!j.ok||!j.state)return;var st=j.state;var changed=false;
  Object.keys(st.seen||{}).forEach(function(k){if(!S.seen[k]){S.seen[k]=st.seen[k];changed=true}});
  Object.keys(st.rulings||{}).forEach(function(k){var a=S.rulings[k],b=st.rulings[k];if(!a||(b.ts||'')>(a.ts||'')){S.rulings[k]=b;changed=true}});
  if(changed){LS.set('seen',S.seen);LS.set('rulings',S.rulings);if(S.master)render()}}).catch(function(){})}
function syncStateUp(){if(!hasWriter())return;clearTimeout(syncTimer);syncTimer=setTimeout(function(){gsPost({action:'state',state:{seen:S.seen,rulings:S.rulings,updatedAt:new Date().toISOString()}}).catch(function(){})},1500)}
/* ---------- column model ---------- */
var COLS=[],COLTYPE={};
function buildColumnModel(){
  var m=S.master;COLS=FIXED.slice(0,9).concat(COMPUTED).concat(['SCOUT_ACTION']).concat(m.payloadKeys.filter(function(k){return COMPUTED.indexOf(k)<0}));
  COLS=COLS.filter(function(c,i){return COLS.indexOf(c)===i});
  COLTYPE={};
  COLS.forEach(function(c){
    if(DATE_KEYS[c])COLTYPE[c]='date';else if(MONEY_KEYS[c])COLTYPE[c]='money';
    else{var set={},n=0,len=0;S.rows.forEach(function(r){var v=val(r,c);if(v){if(!set[v]){set[v]=1;n++}len+=v.length}});
      var avg=S.rows.length?len/S.rows.length:0;COLTYPE[c]=(n<=45&&avg<40)||['BUCKET','DISPOSITION','SECTION','NEW','MISMATCH','TIM_RULING','FLEX','NOTIFICATION_SOURCE','SALARY_CONF','SALARY_BASIS','DECLINE_REASON_CODE','FLOOR_STATUS'].indexOf(c)>=0?'enum':'text'}
  });
}
function visibleCols(){var phone=window.innerWidth<=760;var set=phone?S.cols.phone:S.cols.desktop;return set.filter(function(c){return COLS.indexOf(c)>=0})}
/* ---------- presets ---------- */
var PRESETS={
  ALL:{label:'All',text:'no preset',fn:function(){return true}},

function cmp(a,b){if(a===b)return 0;if(a===''||a==null)return 1;if(b===''||b==null)return -1;var na=parseFloat(a),nb=parseFloat(b);if(!isNaN(na)&&!isNaN(nb)&&/^[\d.\-]+$/.test(a)&&/^[\d.\-]+$/.test(b))return na-nb;return a<b?-1:1}
function passes(r){
  if(!PRESETS[S.preset].fn(r))return false;
  if(S.search){var q=S.search.toLowerCase();if(r.raw.toLowerCase().indexOf(q)<0)return false}
  for(var c in S.filters){var f=S.filters[c],v=val(r,c);
    if(f.type==='enum'){if(f.values&&f.values.length&&f.values.indexOf(v||'(blank)')<0)return false}
    else if(f.type==='text'){if(f.contains&&v.toLowerCase().indexOf(f.contains.toLowerCase())<0)return false;if(f.not&&v.toLowerCase().indexOf(f.not.toLowerCase())>=0)return false}
    else if(f.type==='date'){var d=PipelineParser.parseDate(v);if(f.from&&(!d||d<PipelineParser.parseDate(f.from)))return false;if(f.to&&(!d||d>PipelineParser.parseDate(f.to)))return false}
    else if(f.type==='money'){var mm=c==='COMP_MID'?(r.compMid!=null?{mid:r.compMid}:null):PipelineParser.parseMoney(v);if(f.min&&(!mm||mm.mid<+f.min))return false;if(f.max&&(!mm||mm.mid>+f.max))return false}
  }

}
function defaultSort(a,b){
  var bo=S.cols.bucketOrder;var ia=bo.indexOf(a.BUCKET),ib=bo.indexOf(b.BUCKET);if(ia<0)ia=99;if(ib<0)ib=99;if(ia!==ib)return ia-ib;
  if(S.preset==='APPLIED'){var d=cmp(a.DISPOSITION,b.DISPOSITION);if(d)return d}
  var na=isNew(a)?0:1,nb=isNew(b)?0:1;if(na!==nb)return na-nb;
  var ta=a.dateAdded?a.dateAdded.getTime():-1,tb=b.dateAdded?b.dateAdded.getTime():-1;if(ta!==tb)return tb-ta;
  return cmp(b.payload.SALARY_ASOF||'',a.payload.SALARY_ASOF||'')||cmp(a.COMPANY,b.COMPANY);

  if(!R){h+='<div class="tip">'+(hasWriter()?'Rules not loaded yet (the writer reads the Doc on refresh).':'Writer not configured on this device, so the canonical file cannot be read here. Open the Doc directly: '+link+'.')+'</div></div>';v.innerHTML=h;return}
  if(R.status==='UNAVAILABLE'){h+='<div class="tip"><span class="bad">RULES UNAVAILABLE</span> '+esc(R.error||'')+' · intake default is ALLOW_INTAKE with review flags; nothing is excluded until the Doc is readable.</div></div>';v.innerHTML=h;return}
  var hdr=R.header||{};h+='<div class="kv" style="margin-bottom:8px">'+['STATUS','DEFAULT_ACTION','OWNER','UNKNOWN_RULE','EXCEPTION_AUTHORITY','AUDIT_REQUIREMENT','SCOPE'].filter(function(k){return hdr[k]}).map(function(k){return '<div>'+esc(k)+'</div><div>'+esc(hdr[k])+'</div>'}).join('')+'<div>DOC MODIFIED</div><div class="mono">'+esc(R.modifiedTime||'')+'</div></div>'+
    tbl(['RULE_ID','CATEGORY','STATUS','ACTION','MATCH','DO_NOT_MATCH','REASON','EXCEPTION'],(R.rules||[]).map(function(r){return ['<span class="mono">'+esc(r.RULE_ID)+'</span>',esc(r.CATEGORY),'<span style="color:'+(r.active?'var(--ng)':'var(--dim)')+'">'+esc(r.STATUS)+'</span>','<span class="mono">'+esc(r.ACTION)+'</span>',esc(r.MATCH),esc(r.DO_NOT_MATCH),esc(r.REASON),esc(r.EXCEPTION)]}))+'</div>';
  v.innerHTML=h;
}
/* ---------- settings (writer) ---------- */
function renderSettings(){var v=$('view-settings');v.innerHTML='<div class="panel active"><h3>Writer setup · Google Apps Script running in your account</h3><div class="tip" style="margin-bottom:8px">With this configured the page reads the master through the script (no link sharing needed), writes your rulings into the master row in place with a receipt, and syncs seen-state and rulings across your devices. Setup steps: <span class="mono">apps-script/README.md</span> in the repo. Nothing runs on a schedule.</div>'+
 '<div class="row"><span class="u" style="width:90px">script URL</span><input type="text" id="cfg-url" style="flex:1;min-width:240px" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(S.cfg.url)+'"></div>'+
 '<div class="row"><span class="u" style="width:90px">passphrase</span><input type="text" id="cfg-key" style="width:220px" value="'+esc(S.cfg.key)+'"></div>'+
 '<div class="row"><button id="cfg-test">Test</button><button id="cfg-save" class="neon">Save</button><button id="cfg-clear">Clear</button><span id="cfg-msg" class="tip"></span></div>'+
 '<div class="tip" style="margin-top:8px">Status: '+(hasWriter()?'<span class="pill ok">WRITER ON</span>':'<span class="pill bad">WRITER OFF</span> reading via /api/master (needs the Doc shared by link); rulings held on this device')+'</div></div>'+
 '<div class="panel"><h3>Receipts</h3><div class="row"><button id="cfg-receipts">Load receipts from Drive</button></div><pre id="cfg-rc" class="mono" style="white-space:pre-wrap;font-size:9.5px;color:var(--dim)"></pre></div>';
 $('cfg-test').onclick=function(){var u=$('cfg-url').value.trim(),k=$('cfg-key').value.trim();var old=S.cfg;S.cfg={url:u,key:k};$('cfg-msg').textContent='testing…';gsGet('ping').then(function(j){$('cfg-msg').textContent=j.ok?'OK · script answers · master '+(j.master||'').slice(0,12)+'…':'script says: '+(j.error||'not ok');S.cfg=old}).catch(function(e){$('cfg-msg').textContent='no answer: '+e.message;S.cfg=old})};
 $('cfg-save').onclick=function(){S.cfg={url:$('cfg-url').value.trim(),key:$('cfg-key').value.trim()};LS.set('cfg',S.cfg);renderSettings();load()};
 $('cfg-clear').onclick=function(){S.cfg={url:'',key:''};LS.set('cfg',S.cfg);renderSettings()};
 $('cfg-receipts').onclick=function(){if(!hasWriter()){$('cfg-rc').textContent='writer not configured';return}gsGet('receipts').then(function(j){$('cfg-rc').textContent=j.ok?(j.text||'(no receipts yet)'):(j.error||'error')}).catch(function(e){$('cfg-rc').textContent=e.message})};
}
$('settings').onclick=function(){switchTab('settings')};
/* ---------- tabs, hash, boot ---------- */
function switchTab(t){S.tab=t;document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-tab')===t)});$('settings').classList.toggle('on',t==='settings');document.querySelectorAll('.view').forEach(function(v){v.classList.toggle('on',v.id==='view-'+t)});$('presets').style.display=t==='pipeline'?'flex':'none';$('filters').style.display=(t==='pipeline'&&Object.keys(S.filters).length)?'flex':'none';if(t==='settings')renderSettings();if(t==='quality')renderQuality();if(t==='rules')renderRules();if(S.master)render()}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){switchTab(b.getAttribute('data-tab'))}});
$('refresh').onclick=function(){load()};
function pushHash(){var o={p:S.preset,s:S.sort,f:S.filters};try{history.replaceState(null,'','#'+encodeURIComponent(JSON.stringify(o)))}catch(e){}}
function readHash(){try{if(location.hash.length>1){var o=JSON.parse(decodeURIComponent(location.hash.slice(1)));if(o.p&&PRESETS[o.p])S.preset=o.p;if(o.s)S.sort=o.s;if(o.f)S.filters=o.f}}catch(e){}}
window.addEventListener('resize',function(){if(S.master)render()});
readHash();
var cache=LS.get('cache',null);if(cache){apply(cache.text,cache.meta,true)}
load();
})();
</script>

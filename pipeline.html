<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pipeline Explorer</title>
<style>
:root{--bg:#000;--panel:#0a0a0a;--panel2:#111;--line:#232323;--line2:#343434;--text:#e6e6e6;--dim:#9a9a9a;--faint:#5c5c5c;--white:#fff;--ng:#a9d77d;--nc:#00e5ff;--nm:#ff2d75;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:11px/1.35 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line2);border-radius:2px;padding:4px 9px;cursor:pointer;letter-spacing:.4px;text-transform:uppercase;font-size:10px}
button:hover{border-color:var(--white)}button.on{border-color:var(--white);color:var(--white);box-shadow:inset 0 0 0 1px #fff2}
button.neon{border-color:var(--nc);color:var(--nc)}button.danger{border-color:var(--nm);color:var(--nm)}
input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{background:#050505;border:1px solid var(--line2);border-radius:2px;padding:4px 6px;color:var(--text);color-scheme:dark}
a{color:var(--nc);text-decoration:none}
.mono{font-family:var(--mono)}.dim{color:var(--dim)}.faint{color:var(--faint)}.u{text-transform:uppercase;letter-spacing:1.4px;font-size:9px;color:var(--dim)}
#app{display:flex;flex-direction:column;height:100%}
header{flex:none;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0d0d0d,#050505);background-image:repeating-linear-gradient(0deg,transparent 0 23px,#ffffff08 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,#ffffff08 23px 24px);padding:6px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:3px;font-size:12px;color:var(--white)}.brand small{display:block;font-weight:400;letter-spacing:1px;font-size:9px;color:var(--faint)}
.build-identity{position:relative;flex:none}.build-badge{font:9px var(--mono);text-transform:none;letter-spacing:0;padding:3px 6px;color:var(--dim);border-color:var(--line2);white-space:nowrap}.build-badge.latest{color:var(--ng);border-color:var(--ng)}.build-badge.behind{color:var(--nm);border-color:var(--nm)}.build-badge.unknown{color:var(--nm);border-color:var(--nm)}
.build-panel{position:absolute;right:0;top:calc(100% + 6px);z-index:50;min-width:310px;max-width:min(430px,90vw);padding:9px;background:#080808;border:1px solid var(--line2);box-shadow:0 8px 30px #000;color:var(--text);font:10px/1.45 var(--sans)}.build-panel[hidden]{display:none}.build-panel h3{margin:0 0 7px;font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim)}.build-panel .build-row{display:grid;grid-template-columns:105px minmax(0,1fr);gap:4px 8px;margin:3px 0}.build-panel .build-key{color:var(--faint);font-family:var(--mono);text-transform:uppercase;font-size:9px}.build-panel .build-value{min-width:0;overflow-wrap:anywhere}.build-panel .build-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.build-panel .build-status{margin-top:7px;color:var(--dim)}
#readout{font-family:var(--mono);font-size:10px;color:var(--dim);flex:1;min-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#readout b{color:var(--white);font-weight:600}#readout .bad{color:var(--nm)}#readout .good{color:var(--ng)}
nav{display:flex;gap:2px}nav button{border-color:transparent;color:var(--dim)}nav button.on{border-color:var(--line2);color:var(--white)}
.bar{flex:none;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:5px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:2px;padding:2px 7px;font-size:10px;color:var(--dim);cursor:pointer;background:#070707}
.chip.on{border-color:var(--white);color:var(--white)}.chip .x{color:var(--faint);margin-left:2px}.chip .x:hover{color:var(--nm)}
#predicate{font-family:var(--mono);font-size:9.5px;color:var(--faint);width:100%}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;overflow:auto}.view.on{display:block}
#gridwrap{position:absolute;inset:0;overflow:auto}
table{border-collapse:separate;border-spacing:0;font-size:11px;min-width:100%}
th,td{border-bottom:1px solid var(--line);border-right:1px solid #161616;padding:3px 7px;text-align:left;vertical-align:top;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis;height:22px}
th{position:sticky;top:0;z-index:3;background:#080808;color:var(--dim);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;user-select:none;border-bottom:1px solid var(--line2)}
th .fx{color:var(--faint);margin-left:4px;font-size:9px}th.sorted{color:var(--white)}th.filtered .fx{color:var(--nc)}
td.sticky,th.sticky{position:sticky;z-index:2;background:#050505}th.sticky{z-index:4}
tbody tr:hover td{background:#0e0e0e}tbody tr.focus td{background:#101416;box-shadow:inset 0 -1px 0 var(--nc)}
tbody tr.seen td{color:#c9c9c9}td.mono{font-family:var(--mono);font-size:10.5px}
.g{font-family:var(--mono);margin-right:4px}.g.new{color:var(--ng)}.g.rule{color:var(--nc)}.g.pend{color:var(--nm)}.g.err{color:var(--nm)}
td.b-READY_TO_PURSUE{color:var(--white)}td.b-APPLIED{color:var(--white)}td.b-DECLINED_BY_TIM,td.b-DUPLICATE,td.b-CLOSED_DEAD,td.b-INVALID_DISCOVERY{color:var(--faint)}td.b-BLOCKED,td.b-TIM_DECISION_REQUIRED{color:var(--nc)}
td.b-SCOUT_INTAKE{color:var(--ng);font-weight:600}td.b-DISCOVERY_LEAD{color:var(--ng);opacity:.75}
.chip.hot{border-color:var(--ng);color:var(--ng)}.sec{border:1px solid var(--line);margin:8px 0;padding:6px 8px}.sec h4{margin:0 0 4px;font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim)}.sec.scout h4{color:var(--ng)}.sec.claude h4{color:#b58cff}.sec.forge h4{color:var(--white)}.sec.tim h4{color:var(--nc)}
.kpi{display:inline-block;min-width:110px;margin:3px 6px 3px 0;padding:4px 8px;border:1px solid var(--line2)}.kpi b{display:block;font-family:var(--mono);font-size:14px;color:var(--white)}.kpi span{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
.panel{border:1px solid var(--line);background:var(--panel);margin:8px;padding:8px 10px;position:relative}
.panel.active::before,.panel.active::after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--white)}
.panel.active::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.panel.active::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.panel h3{margin:0 0 6px;font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);font-weight:600}
.rep table{width:100%}.rep th{position:static;cursor:default}.rep td{white-space:normal}
.kv{display:grid;grid-template-columns:150px 1fr;gap:3px 10px;font-size:10.5px}.kv div:nth-child(odd){color:var(--faint);font-family:var(--mono);font-size:9.5px;text-transform:uppercase}.kv div:nth-child(even){white-space:pre-wrap;word-break:break-word}
#drawer{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:#060606;border-left:1px solid var(--line2);z-index:20;display:none;flex-direction:column}#drawer.on{display:flex}
#drawer .dh{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}#drawer .dh h2{margin:0;font-size:13px;color:var(--white);font-weight:600}#drawer .dh .sub{color:var(--dim);font-size:10px}
#drawer .db{flex:1;overflow:auto;padding:8px 10px}
#drawer .rul{border:1px solid var(--nc);padding:8px;margin-bottom:8px;background:#04090a}#drawer .rul h3{color:var(--nc)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
#pop{position:fixed;z-index:30;background:#0b0b0b;border:1px solid var(--line2);padding:8px;min-width:220px;max-width:320px;max-height:60vh;overflow:auto;display:none;box-shadow:0 8px 30px #000}
#pop label{display:block;font-size:10.5px;padding:2px 0;cursor:pointer}#pop .cnt{color:var(--faint);font-family:var(--mono);float:right}
#autobar{flex:none;border-top:1px solid var(--line);background:var(--panel);padding:4px 10px;font-family:var(--mono);font-size:10px;color:var(--dim);display:flex;gap:14px;align-items:center;overflow:hidden;cursor:pointer;white-space:nowrap}
#autobar b{color:var(--white);font-weight:600}#autobar .t{color:var(--ng)}#autobar .soon{color:var(--nm)}
.tip{color:var(--faint);font-size:9.5px}
.pill{display:inline-block;padding:1px 6px;border:1px solid var(--line2);border-radius:2px;font-family:var(--mono);font-size:9.5px}.pill.ok{border-color:var(--ng);color:var(--ng)}.pill.bad{border-color:var(--nm);color:var(--nm)}
textarea.cfg{width:100%;height:280px;font-family:var(--mono);font-size:10px}
@media (max-width:760px), (pointer:coarse) and (max-width:980px){body{font-size:10.5px}header{padding:3px 6px;gap:6px}.brand{font-size:10px;letter-spacing:2px}.brand small{display:none}.build-panel{position:fixed;right:6px;top:48px;max-width:calc(100vw - 12px)}nav button,#refresh{padding:2px 6px;font-size:9px}th,td{padding:2px 5px;height:20px;max-width:200px}#readout{font-size:9px;order:5;flex-basis:100%}#drawer{width:100%}.kv{grid-template-columns:110px 1fr}#autobar{font-size:9px;gap:10px;padding:3px 6px}.bar{padding:3px 6px;gap:4px}.chip{padding:1px 5px;font-size:9.5px}#predicate{display:none}#search{width:120px!important}#markseen{padding:2px 6px;font-size:9px}}
@media (max-height:520px){header{padding:3px 6px;gap:6px}.brand{font-size:10px}.brand small{display:none}nav button,#refresh{padding:2px 6px;font-size:9px}#readout{font-size:9px}#predicate{display:none}.bar{padding:3px 6px;gap:4px}.chip{padding:1px 5px;font-size:9.5px}#autobar{padding:2px 6px;font-size:9px}th,td{height:20px;padding:2px 5px}}

/* v5 workspace */
#view-pipeline{overflow:hidden!important}
#dash{height:30%;min-height:150px;max-height:270px;border-bottom:1px solid var(--line);padding:10px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;background:#050505;overflow:auto}
.dash-card{border:1px solid var(--line);background:#0a0a0a;border-radius:6px;padding:10px;min-width:0}
.dash-card.k{grid-column:span 2}.dash-card.w{grid-column:span 4}.dash-card h4{margin:0 0 5px;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}.dash-card b{font:700 20px var(--mono);color:#fff}.dash-card .barline{height:5px;background:#181818;margin-top:6px;border-radius:8px;overflow:hidden}.dash-card .barline i{display:block;height:100%;background:#d8d8d8}
#worksplit{height:70%;min-height:0;display:flex;overflow:hidden}
#gridpane{flex:1;min-width:38%;position:relative;overflow:hidden}
#gridwrap{position:absolute;inset:0;overflow:auto!important;overscroll-behavior:contain}
#drawer{position:relative!important;top:auto!important;right:auto!important;bottom:auto!important;width:46%;min-width:380px;max-width:680px;background:#070707;border-left:1px solid var(--line2);z-index:2;display:none;flex-direction:column}
#drawer.on{display:flex}
#detail-tabs{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);background:#090909;flex:none}
#detail-tabs button{border-color:transparent;color:var(--dim);text-transform:none}
#detail-tabs button.on{border-color:var(--line2);color:#fff}
#drawer .db{padding:10px}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.detail-card{border:1px solid var(--line);border-radius:6px;background:#0a0a0a;padding:9px;min-width:0}.detail-card.full{grid-column:1/-1}.detail-card h3{margin:0 0 7px;font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim)}
.edit-grid{display:grid;grid-template-columns:140px 1fr;gap:6px 8px;align-items:center}.edit-grid label{color:var(--dim);font-size:10px}.edit-grid textarea{min-height:78px;resize:vertical}
.enrich-grid{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 8px;align-items:center}.enrich-grid label{color:var(--dim);font-size:10px}.enrich-grid input,.enrich-grid select,.enrich-grid textarea{min-width:0;width:100%;box-sizing:border-box}.enrich-grid textarea{min-height:58px;resize:vertical}.gap-list{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 8px}.gap-list span{border:1px solid var(--nm);color:var(--nm);padding:2px 5px;font:9px var(--mono);text-transform:uppercase}.research-note{border-left:2px solid var(--nc);padding-left:7px;color:var(--dim);font-size:10px;line-height:1.4}
.conf{display:inline-block;margin-left:5px;padding:1px 5px;border:1px solid var(--line2);border-radius:8px;font:9px var(--mono)}.conf.VERIFIED,.conf.HIGH{color:var(--ng);border-color:var(--ng)}.conf.ESTIMATED,.conf.MED,.conf.MEDIUM{color:var(--nc);border-color:var(--nc)}.conf.UNKNOWN,.conf.LOW{color:var(--nm);border-color:var(--nm)}
.changed{color:var(--nc);font-size:9px;margin-left:4px}.pin{font-size:14px;color:var(--faint)}.pin.on{color:#fff}
.timeline{border-left:1px solid var(--line2);margin-left:6px;padding-left:12px}.event{margin:0 0 12px;position:relative}.event:before{content:"";position:absolute;left:-16px;top:4px;width:7px;height:7px;border-radius:50%;background:#aaa}.event .ts{font:9px var(--mono);color:var(--faint)}.event .ev{font-size:10.5px}
.doc-workspace{display:grid;grid-template-columns:minmax(360px,44%) minmax(0,56%);height:calc(100vh - 118px);min-height:540px;overflow:hidden}
.doc-library{min-width:0;overflow:auto;border-right:1px solid var(--line);background:#060606}
.docgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px;align-content:start}
.docbox{border:1px solid var(--line);border-radius:7px;background:#090909;padding:10px;min-height:220px}.docbox h3{margin:0 0 8px;font-size:10px;letter-spacing:1.2px;text-transform:uppercase}
.docitem{display:flex;gap:8px;align-items:center;padding:7px 5px;border-bottom:1px solid #171717;border-radius:4px;cursor:pointer}.docitem:hover{background:#111}.docitem.selected{background:#151515;outline:1px solid #303030}.docitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.docitem .nm .docname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.approved{color:var(--ng);font:9px var(--mono)}
.doc-preview-pane{min-width:0;display:flex;flex-direction:column;background:#050505}
.doc-preview-head{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:#090909;min-height:56px}.doc-preview-head .meta{flex:1;min-width:0}.doc-preview-head h3{margin:0 0 3px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.doc-preview-head .tip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-preview-actions{display:flex;gap:6px;flex:none}.doc-preview-body{position:relative;flex:1;min-height:0;background:#111}.doc-preview-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}.doc-preview-empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;color:var(--faint);font:11px var(--mono);line-height:1.6}.doc-preview-fallback{padding:18px}.doc-type{display:inline-block;border:1px solid #333;border-radius:10px;padding:2px 6px;font:8px var(--mono);color:#aaa;margin-left:6px}
.doc-score-panel{border-top:1px solid var(--line2);padding:12px;background:#070707}.doc-score-panel h2{margin:0 0 4px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#fff}.doc-score-panel h3{margin:0 0 5px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}.doc-score-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}.doc-score-card{border:1px solid var(--line2);border-radius:6px;background:#0b0b0b;padding:9px;min-width:0}.doc-score-card .doc-score-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dfe7df;font-size:10px;margin-bottom:7px}.doc-score-metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px}.doc-score-metric{border:1px solid #28332d;padding:7px;background:#080b09}.doc-score-metric b{display:block;font:700 22px var(--mono);color:#d9e6d9}.doc-score-metric span{display:block;margin-top:2px;color:var(--faint);font:9px var(--mono);text-transform:uppercase}.doc-score-card .good{color:var(--ng)}.doc-score-card .warn{color:#e4c66d}.doc-score-card .unknown{color:var(--faint);font-size:18px}.doc-score-hits{margin-top:7px;color:#9fb1a2;font:9px var(--mono);line-height:1.35;word-break:break-word}.doc-score-profile{border-top:1px solid var(--line);padding-top:10px}.doc-score-profile textarea{width:100%;min-height:70px;resize:vertical}.doc-score-profile .tip{max-width:920px}.doc-paste{margin-top:8px}.doc-paste-msg{color:#e4c66d;margin-bottom:5px}.doc-paste-text{width:100%;min-height:110px;resize:vertical;box-sizing:border-box;font:11px/1.4 var(--mono)}.doc-paste .row{margin-top:5px}
.bulkbar{display:inline-flex;gap:4px;align-items:center}.bulkbar b{font:10px var(--mono);color:#fff}
.resize-handle{position:absolute;right:-2px;top:0;width:5px;height:100%;cursor:col-resize;z-index:5}
th{position:sticky} th{min-width:70px} td,th{max-width:none}

/* selected-job US map */
#job-map-card{grid-column:9/13;grid-row:1/3;padding:0;overflow:hidden;position:relative;min-height:212px;background:radial-gradient(circle at 50% 45%,#111 0,#090909 58%,#070707 100%)}
.map-head{position:absolute;left:10px;right:10px;top:8px;z-index:3;display:flex;align-items:flex-start;gap:8px;pointer-events:none}
.map-head .map-title{flex:1;min-width:0}.map-head .map-title h4{margin-bottom:2px}.map-head .map-title .tip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-mode{pointer-events:auto;display:flex;border:1px solid #292929;border-radius:6px;overflow:hidden;background:#080808}
.map-mode button{border:0;border-radius:0;padding:4px 7px;font-size:8px;letter-spacing:.4px;color:var(--faint);background:transparent}
.map-mode button.on{background:#efefef;color:#090909}
.job-map{position:absolute;inset:38px 7px 24px;overflow:hidden}
.job-map svg{width:100%;height:100%;display:block}
.map-empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--faint);font:10px var(--mono);padding:20px}
.map-outline{fill:url(#usDots);stroke:#686868;stroke-width:1.2;opacity:.88}
.map-grid{stroke:#202020;stroke-width:.7;opacity:.7}
.map-coast-glow{fill:none;stroke:#a7a7a7;stroke-width:4;opacity:.05;filter:url(#mapGlow)}
.map-pin{cursor:pointer}
.map-pin .halo{opacity:.25;filter:url(#pinGlow)}
.map-pin.primary .core{fill:#f2f2f2}.map-pin.primary .halo{fill:#f2f2f2}
.map-pin.secondary .core{fill:#a8a8a8}.map-pin.secondary .halo{fill:#a8a8a8}
.map-pin.home .core{fill:#fff}.map-pin.home .halo{fill:#fff;opacity:.42}
.map-pin.approx .core{stroke:#777;stroke-width:2;stroke-dasharray:2 2}
.map-pin.home .halo,.map-pin.primary.pulse .halo{animation:mapPulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes mapPulse{0%{transform:scale(.75);opacity:.42}70%{transform:scale(1.6);opacity:.05}100%{transform:scale(1.7);opacity:0}}
.map-tip-bg,.map-tip-text{opacity:0;transition:opacity .12s ease}.map-pin:hover .map-tip-bg,.map-pin:hover .map-tip-text{opacity:1}
.map-tip-bg{fill:#080808;stroke:#444;stroke-width:1}.map-tip-text{fill:#f4f4f4;font:10px var(--mono);pointer-events:none}.map-tip-sub{fill:#a0a0a0;font-size:8.5px}
.map-legend{position:absolute;left:10px;bottom:7px;z-index:3;display:flex;gap:10px;align-items:center;color:#8d8d8d;font:8px var(--mono);pointer-events:none}.map-legend span{display:flex;gap:4px;align-items:center}.map-dot{width:6px;height:6px;border-radius:50%;background:#eee;box-shadow:0 0 7px rgba(255,255,255,.55)}.map-dot.secondary{background:#999;box-shadow:none}.map-dot.home{background:#fff;border:1px solid #777;box-shadow:0 0 8px rgba(255,255,255,.8)}

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual harness placeholder — not an approved design</title>
<link rel="stylesheet" href="sample-tokens.css">
<style>
* { box-sizing: border-box; }
body { margin:0; background:var(--sample-bg); color:var(--sample-text); font-family:var(--sample-font); font-size:var(--sample-size); font-weight:var(--sample-weight); letter-spacing:var(--sample-spacing); }
#panel { position:absolute; top:24px; left:24px; width:calc(100% - 48px); height:160px; padding:16px; border:var(--sample-border); border-radius:var(--sample-radius); background:var(--sample-panel); }
h1 { font:inherit; margin:0 0 16px; }
#motion { width:24px; height:24px; background:var(--sample-text); }
</style></head><body>
<main id="panel"><h1>Visual harness placeholder</h1><div id="count"></div><div id="motion" aria-label="Motion sample"></div></main>
<script>
(async () => {
 const cfg = JSON.parse(localStorage.getItem('px.cfg'));
 const result = await (await fetch(cfg.url + '?action=master')).json();
 document.querySelector('#count').textContent = 'Fixture loaded: ' + result.id;
 window.sampleAnimation = document.querySelector('#motion').animate([{opacity:0.5},{opacity:1}], {
   duration:parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sample-duration')),
   easing:getComputedStyle(document.documentElement).getPropertyValue('--sample-easing').trim(), fill:'both'
 });
 window.sampleAnimation.pause();
 document.body.dataset.ready = 'true';
})();
</script></body></html>

<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- BUILD 5: the golden check sees ONLY these system fonts (Ubuntu 24.04 packages fonts-inter, fonts-dejavu-core / -mono,
     fonts-liberation, fonts-noto-color-emoji), so the few fallback glyphs in the golden frames (⇤ │ Σ ◎ 🔔) resolve to the same
     font on any machine. Everything else is web fonts from fonts/. Used via FONTCONFIG_FILE by check-golden.cjs, which writes a copy with @FONTCONFIG_DIR@ set to the absolute tests/visual/fontconfig path.
     The rules come from tests/visual/fontconfig/ (a copy of the conf.d the goldens were rendered with, incl. 56-prefer-inter.conf
     and the hinting / antialias settings), never from the machine's /etc/fonts/conf.d: a runner without 56-prefer-inter.conf
     sends the fallback glyphs to DejaVu Sans and the ticker shifts (CI 3336 px, both frames). -->
<fontconfig>
  <include>@FONTCONFIG_DIR@</include>
  <reset-dirs/>
  <dir>/usr/share/fonts/opentype/inter</dir>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <dir>/usr/share/fonts/truetype/noto</dir>
  <cachedir prefix="xdg">fontconfig-golden</cachedir>
</fontconfig>

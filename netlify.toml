[build]
  command = "node scripts/write-build-info.cjs"
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/feed"
  to = "/.netlify/functions/feed"
  status = 200


[[redirects]]
  from = "/api/master"
  to = "/.netlify/functions/master"
  status = 200

[[redirects]]
  from = "/"
  to = "/pipeline.html"
  status = 302
  force = true

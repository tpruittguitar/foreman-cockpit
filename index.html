<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Foreman Cockpit</title>
<style>
  :root{
    --bg:#08080A; --bg2:#0D0E11; --panel:#131418; --panel2:#191B20;
    --line:#242730; --line2:#343945; --hair:#1C1E24;
    --text:#EAECEF; --dim:#99A0AB; --faint:#5C626E;
    --edge:#7FB0FF; --edge2:#A9CBFF;
    --ok:#8FB8A0; --warn:#C9A96A; --nok:#D08A83; --info:#8AA6C9;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  html{background:radial-gradient(1200px 600px at 50% -240px, rgba(127,176,255,.06), transparent 70%),var(--bg);min-height:100%}
  body{color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    padding:11px;-webkit-font-smoothing:antialiased;font-size:13px;min-height:100vh}
  #app{max-width:1180px;margin:0 auto}
  /* desktop: roomier, wider calendar cards */
  @media (min-width:900px){
    body{font-size:13.5px;padding:16px}
    .cal{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
    td{font-size:11.5px}
  }
  /* mobile: shrink text + padding so tables fit */
  @media (max-width:600px){
    body{font-size:12px;padding:8px}
    th{padding:5px 6px;font-size:8px}
    td{padding:5px 6px;font-size:10px;line-height:1.3}
    .note{font-size:9px}
    .btn{padding:5px 9px;font-size:11px}
    .head{padding:9px 10px}
    .pt{font-size:9px;letter-spacing:1px}
    .chip{font-size:9px;padding:1px 5px}
    .cal{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
    .nodes{grid-template-columns:repeat(3,1fr);gap:5px}
    .nc{padding:6px 7px}
    .nc .tag{font-size:8px;padding:1px 4px}
    .nc span{font-size:10px}
    .modal{padding:10px}
    .modal .box{padding:13px 14px}
  }
  .row{display:flex;justify-content:space-between;align-items:center}
  .grid{display:grid;gap:8px}
  button{cursor:pointer;font-family:inherit}
  .btn{background:linear-gradient(180deg,var(--panel2),var(--panel));color:var(--text);
    border:1px solid var(--line2);border-radius:6px;padding:6px 11px;font-size:11.5px;
    font-weight:600;letter-spacing:.3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);transition:transform .12s ease}
  .btn:active{transform:translateY(1px)}
  .btn.on{background:linear-gradient(180deg,#20242c,#171a20);border-color:var(--edge);
    box-shadow:inset 0 1px 0 rgba(169,203,255,.25), 0 0 14px rgba(127,176,255,.28)}
  .mono{font-family:var(--mono)}
  .head{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;margin-bottom:10px;background:linear-gradient(180deg,#15171d,#0f1116);
    box-shadow:0 6px 22px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06)}
  .head::after{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(127,176,255,.14),transparent);animation:scan 4.2s linear infinite}
  @keyframes scan{0%{left:-45%}100%{left:105%}}
  .panel{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;
    background:linear-gradient(180deg,var(--panel),#0F1014);margin-bottom:9px;
    box-shadow:0 8px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);animation:rise .35s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .ph{display:flex;justify-content:space-between;align-items:center;padding:7px 11px;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(127,176,255,.05),transparent)}
  .pt{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--dim)}
  .pb{padding:9px 11px}
  .pb.flush{padding:0}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:4px;
    font-size:9.5px;font-weight:600;white-space:nowrap;letter-spacing:.3px;border:1px solid var(--line2);background:var(--bg2)}
  .chip .g{font-size:8px}
  .tag{font-size:9px;padding:1px 5px;border-radius:3px;font-family:var(--mono);color:var(--dim);background:var(--bg2);border:1px solid var(--line)}
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:8.5px;letter-spacing:.6px;color:var(--faint);text-transform:uppercase;
    padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700}
  td{padding:6px 9px;border-bottom:1px solid var(--hair);vertical-align:top;font-size:11px;line-height:1.35}
  tbody tr:last-child td{border-bottom:none}
  tbody tr.clk{cursor:pointer}
  tbody tr.clk:hover{background:rgba(127,176,255,.07)}
  tr.urgent td{box-shadow:inset 2px 0 0 var(--nok)}
  tr.hot td:first-child{box-shadow:inset 2px 0 0 var(--nok)}
  .co{font-weight:700;white-space:nowrap}
  .sub{color:var(--faint);font-size:9.5px}
  .note{color:var(--dim);font-size:10px}
  .fore{color:var(--info);font-size:9.5px;margin-top:2px}
  .heat{font-size:8.5px;font-weight:700;letter-spacing:.4px}
  .rank{font-family:var(--mono);font-weight:800;color:var(--edge2);font-size:12px}
  .lk{color:var(--info);font-size:9px;white-space:nowrap}
  .nolk{color:var(--faint);font-size:8.5px}
  .filt{font-size:9.5px;padding:2px 8px;border-radius:4px;border:1px solid var(--line2);background:transparent;color:var(--faint);font-weight:600;letter-spacing:.3px}
  .filt.on{border-color:var(--edge);color:var(--edge2);box-shadow:0 0 8px rgba(127,176,255,.22)}
  .hair{height:1px;background:linear-gradient(90deg,transparent,var(--hair),transparent);margin:7px 0}
  textarea{width:100%;height:100px;background:var(--bg2);color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:9px;font-size:11px;font-family:var(--mono);resize:vertical}
  a{color:var(--info);text-decoration:none}
  .lbl{font-size:9px;letter-spacing:.5px;color:var(--faint);text-transform:uppercase}
  .spin{display:inline-block;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .cal{display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .calc{border:1px solid var(--line);border-radius:6px;padding:8px 9px;background:linear-gradient(180deg,var(--bg2),#0B0C0F)}
  .calc.urgent{border-color:rgba(208,138,131,.5);box-shadow:0 0 16px rgba(208,138,131,.2);animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 12px rgba(208,138,131,.16)}50%{box-shadow:0 0 22px rgba(208,138,131,.32)}}
  .calc.hot{border-color:rgba(127,176,255,.3)}
  .nodes{display:grid;gap:7px;grid-template-columns:repeat(3,1fr)}
  .nc{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:linear-gradient(180deg,var(--bg2),#0B0C0F)}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(4,5,7,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;backdrop-filter:blur(3px)}
  .modal .box{max-width:520px;width:100%;max-height:86vh;overflow:auto;border:1px solid var(--line2);border-radius:10px;
    background:linear-gradient(180deg,#15171d,#0f1116);box-shadow:0 20px 60px rgba(0,0,0,.7), 0 0 24px rgba(127,176,255,.15);padding:16px 17px}
  .modal h3{margin:0 0 2px;font-size:15px}
  .kv{display:flex;gap:8px;font-size:11.5px;margin-top:8px}
  .kv .k{color:var(--faint);min-width:74px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding-top:1px}
  .kv .v{color:var(--text);flex:1;line-height:1.4}
  .nodeline{display:flex;gap:7px;align-items:center;font-size:11px;padding:3px 0;border-bottom:1px solid var(--hair)}
  .x{background:none;border:1px solid var(--line2);color:var(--dim);border-radius:6px;padding:4px 9px;font-size:12px}
  @media (prefers-reduced-motion: reduce){.head::after,.calc.urgent{animation:none}.panel{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
const FEED_URL="/api/feed";

const ST={
  done:{i:"\u2713",c:"var(--ok)",l:"DONE"}, live:{i:"\u25CF",c:"var(--ok)",l:"LIVE"},
  open:{i:"\u25CB",c:"var(--warn)",l:"OPEN"}, pending:{i:"\u25D0",c:"var(--warn)",l:"PENDING"},
  held:{i:"\u23F8",c:"var(--info)",l:"HELD"}, urgent:{i:"\u25B2",c:"var(--nok)",l:"URGENT"},
  blocked:{i:"\u2715",c:"var(--nok)",l:"BLOCKED"},
  interview:{i:"\u25C6",c:"var(--ok)",l:"INTERVIEW"}, recruiter:{i:"\u25C8",c:"var(--info)",l:"RECRUITER"},
  applied:{i:"\u25CB",c:"var(--warn)",l:"APPLIED"}, closed:{i:"\u2715",c:"var(--faint)",l:"CLOSED"}
};
function chip(tok,text){const s=ST[tok]||ST.open;
  return '<span class="chip" style="color:'+s.c+'"><span class="g" aria-hidden>'+s.i+'</span>'+(text||s.l)+'</span>';}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function feedSections(t){const o={};const re=/\[([A-Z]+)\]\s*\n([\s\S]*?)(?=\n\[[A-Z]+\]|$)/g;let m;while((m=re.exec(t))!==null)o[m[1]]=m[2].trim();return o;}
function lines(s){return (s||"").split("\n").map(function(x){return x.trim();}).filter(function(x){return x&&!/^\u2014$/.test(x);});}
function cols(l){return l.split("|").map(function(x){return x.trim();});}

function parse(t){
  const X=feedSections(t);
  const meta=t.match(/Feed updated:\s*([^\n\u00B7]+)(?:\u00B7\s*source board\s*(v\d+))?/);
  const r={updated:meta?meta[1].trim():"",board:meta&&meta[2]?meta[2]:"",nodes:[],schedule:[],calendar:[],positions:[],targets:[],ideas:[],grading:"",tasks:[],watch:[]};
  lines(X.NODES).forEach(function(l){const c=cols(l);const role=c.find(function(x){return x.indexOf("\u00B7")>=0;})||"";const gap=c.find(function(x){return /^UNPROVEN/i.test(x);})||"";const caps=c.slice(2).filter(function(x){return x&&!/^UNPROVEN|^PENDING/.test(x)&&x!==role;});r.nodes.push({name:c[0],health:/PENDING/i.test(c[1])?"pending":"live",caps:caps,gap:gap,role:role});});
  lines(X.SCHEDULE).forEach(function(l){const c=cols(l);r.schedule.push({who:c[0],when:c[1]||""});});
  lines(X.CALENDAR).forEach(function(l){const c=cols(l);r.calendar.push({date:c[0],time:c[1],what:c[2]});});
  lines(X.POSITIONS).forEach(function(l){const c=cols(l);r.positions.push({co:c[0],role:c[1],stage:(c[2]||"").toLowerCase(),heat:c[3]||"",note:c[4]||"",date:c[5]||"",url:c[6]||""});});
  lines(X.TARGETS).forEach(function(l){const c=cols(l);r.targets.push({rank:c[0],co:c[1],role:c[2],fit:c[3]||"",why:c[4]||"",url:c[5]||""});});
  lines(X.IDEAS).forEach(function(l){const c=cols(l);r.ideas.push({node:c[0],title:c[1],body:c[2]||"",grade:c[3]||""});});
  r.grading=(X.GRADING||"").trim();
  lines(X.TASKS).forEach(function(l){const c=cols(l);r.tasks.push({id:c[0],name:c[1],owner:c[2]||"",state:(c[3]||"open").toLowerCase(),note:c[4]||"",fore:c[5]||""});});
  lines(X.WATCH).forEach(function(l){r.watch.push(l);});
  return r;
}
function daysTo(dstr){const d=new Date(dstr+"T12:00:00");const now=new Date(2026,7,9,12);return Math.round((d-now)/864e5);}

let RAW="",FILTER="all",showPaste=false,status="loading",TASKS=[];

async function loadFeed(){status="loading";render();
  try{const res=await fetch(FEED_URL,{cache:"no-store"});if(!res.ok)throw 0;const txt=await res.text();if(!/COCKPIT FEED|\[NODES\]|\[TASKS\]/.test(txt))throw 0;RAW=txt;status="ok";}
  catch(e){ if(typeof DEFAULT_FEED!=="undefined"){RAW=DEFAULT_FEED;status="preview";} else {status="err";} }
  render();}

function openRow(url){ if(url && /^https?:\/\//.test(url)) window.open(url,"_blank","noopener"); }

// parse a task note into per-node work status lines
function nodeStatus(t){
  const out=[];const note=t.note||"";
  ["ChatGPT","Claude","Grok","Foreman","Tim"].forEach(function(n){
    const re=new RegExp(n+"[^;.|]*","i");const m=note.match(re);
    if(m)out.push(m[0].trim());
  });
  return out;
}
function showTask(idx){
  const t=TASKS[idx];if(!t)return;
  const s=ST[t.state]||ST.open;
  const ns=nodeStatus(t);
  let h='<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box">';
  h+='<div class="row"><div><div class="mono" style="font-size:11px;color:var(--edge2);font-weight:700">'+esc(t.id)+'</div><h3>'+esc(t.name)+'</h3></div><button class="x" onclick="closeModal()">\u2715</button></div>';
  h+='<div class="kv"><div class="k">Status</div><div class="v">'+chip(t.state)+'</div></div>';
  h+='<div class="kv"><div class="k">Owner</div><div class="v">'+esc(t.owner||"\u2014")+'</div></div>';
  h+='<div class="kv"><div class="k">Detail</div><div class="v">'+esc(t.note||"\u2014")+'</div></div>';
  if(t.fore)h+='<div class="kv"><div class="k">Foreman</div><div class="v" style="color:var(--info)">\u2691 '+esc(t.fore)+'</div></div>';
  h+='<div class="hair"></div><div class="lbl" style="margin-bottom:4px">AI work status (parsed)</div>';
  if(ns.length)ns.forEach(function(l){h+='<div class="nodeline"><span style="color:var(--edge2)">\u25B8</span><span>'+esc(l)+'</span></div>';});
  else h+='<div class="sub">No per-node breakdown in the detail line \u2014 owner: '+esc(t.owner||"\u2014")+'</div>';
  h+='</div></div>';
  document.getElementById("modal").innerHTML=h;
}
function closeModal(){document.getElementById("modal").innerHTML="";}

function render(){
  const d=RAW?parse(RAW):{nodes:[],schedule:[],calendar:[],positions:[],targets:[],ideas:[],grading:"",tasks:[],watch:[],updated:"",board:""};
  TASKS=d.tasks;
  const counts={done:0,open:0,held:0,urgent:0,blocked:0};
  d.tasks.forEach(function(t){counts[t.state]=(counts[t.state]||0)+1;});
  const active=d.tasks.filter(function(t){return t.state!=="done";});
  const shown=FILTER==="all"?active:FILTER==="done"?d.tasks.filter(function(t){return t.state==="done";}):active.filter(function(t){return t.state===FILTER;});
  const shownIdx=shown.map(function(t){return d.tasks.indexOf(t);});
  const openPos=d.positions.filter(function(p){return p.stage!=="closed";});
  const closedPos=d.positions.filter(function(p){return p.stage==="closed";});

  let statusTxt = status==="ok" ? ' \u00B7 <span style="color:var(--ok)">live</span>'
    : status==="preview" ? ' \u00B7 <span style="color:var(--warn)">preview (offline data)</span>' : '';
  let banner="";
  if(status==="loading")banner='<div class="panel"><div class="pb" style="color:var(--dim)"><span class="spin">\u27F3</span> pulling feed\u2026</div></div>';
  if(status==="err")banner='<div class="panel" style="border-color:var(--nok)"><div class="pb" style="color:var(--nok)">\u2715 feed unreachable \u2014 confirm COCKPIT_FEED_v2 is public, then refresh.</div></div>';

  let html='';
  html+='<div class="head"><div class="row"><div><div style="font-size:15px;font-weight:800;letter-spacing:1.2px">FOREMAN COCKPIT</div><div class="mono" style="font-size:10px;color:var(--faint);margin-top:2px">'+(d.board||"\u2014")+' \u00B7 '+(d.updated||"no feed")+statusTxt+'</div></div><div style="display:flex;gap:6px"><button class="btn on" onclick="loadFeed()">\u21BB refresh</button><button class="btn" onclick="togglePaste()">'+(showPaste?"close":"paste")+'</button></div></div></div>';
  html+=banner;
  if(showPaste)html+='<div class="panel"><div class="pb"><textarea id="pb" placeholder="paste feed text\u2026"></textarea><div style="margin-top:7px"><button class="btn on" onclick="applyPaste()">parse</button></div></div></div>';

  if(d.calendar.length){html+='<div class="panel"><div class="ph"><span class="pt">UPCOMING</span></div><div class="pb"><div class="cal">';
    d.calendar.forEach(function(e){const dd=daysTo(e.date);const u=dd<=1;const cls=u?'calc urgent':(dd<=2?'calc hot':'calc');html+='<div class="'+cls+'"><div class="row"><span class="lbl">'+esc(e.date)+'</span><span class="mono" style="font-size:14px;font-weight:800;color:'+(u?'var(--nok)':'var(--warn)')+'">'+(dd<=0?'TODAY':dd+'d')+'</span></div><div style="font-size:11.5px;font-weight:600;margin-top:3px">'+esc(e.what)+'</div><div class="mono" style="font-size:9.5px;color:var(--dim);margin-top:1px">'+esc(e.time||'')+'</div></div>';});
    html+='</div></div></div>';}

  if(d.nodes.length){html+='<div class="panel"><div class="ph"><span class="pt">NODES</span></div><div class="pb"><div class="nodes">';
    d.nodes.forEach(function(n){html+='<div class="nc"><div class="row" style="margin-bottom:3px"><span style="font-size:11.5px;font-weight:700">'+esc(n.name)+'</span>'+chip(n.health)+'</div><div style="font-size:9.5px;color:var(--faint);margin-bottom:5px">'+esc(n.role)+'</div><div style="display:flex;flex-wrap:wrap;gap:3px">'+n.caps.map(function(c){return '<span class="tag">'+esc(c)+'</span>';}).join("")+'</div>'+(n.gap?'<div style="margin-top:5px;font-size:9.5px;color:var(--warn)">\u25D0 '+esc(n.gap.replace(/^UNPROVEN:?\s*/i,'unproven: '))+'</div>':'')+'</div>';});
    html+='</div></div></div>';}

  // TARGETS — highest-ranked NOT-yet-applied, clickable to JD
  if(d.targets.length){html+='<div class="panel"><div class="ph"><span class="pt">TOP TARGETS \u00B7 NOT APPLIED</span><span style="font-size:9px;color:var(--faint)">click row \u2192 JD</span></div><div class="pb flush"><div class="tw"><table>';
    html+='<thead><tr><th>#</th><th>Company</th><th>Role</th><th>Fit</th><th>Why</th><th>JD</th></tr></thead><tbody>';
    d.targets.forEach(function(p){const has=/^https?:\/\//.test(p.url);html+='<tr class="'+(has?'clk':'')+'" '+(has?'onclick="openRow(\''+esc(p.url)+'\')"':'')+'><td class="rank">'+esc(p.rank)+'</td><td class="co">'+esc(p.co)+'</td><td>'+esc(p.role)+'</td><td class="mono" style="color:var(--edge2);font-weight:700">'+esc(p.fit)+'</td><td class="note">'+esc(p.why)+'</td><td>'+(has?'<span class="lk">open \u2197</span>':'<span class="nolk">no verified link</span>')+'</td></tr>';});
    html+='</tbody></table></div></div></div>';}

  // OPEN POSITIONS — clickable to JD where url present
  html+='<div class="panel"><div class="ph"><span class="pt">OPEN POSITIONS \u00B7 IN PLAY</span><span style="font-size:9.5px;color:var(--faint)">'+openPos.length+' active \u00B7 '+closedPos.length+' closed</span></div><div class="pb flush"><div class="tw"><table>';
  html+='<thead><tr><th>Company</th><th>Role</th><th>Stage</th><th>Heat</th><th>Detail</th><th>Upd</th></tr></thead><tbody>';
  openPos.forEach(function(p){const hc=p.heat==='HOT'?'var(--nok)':p.heat==='ACTION'?'var(--warn)':'var(--faint)';const rc=p.heat==='HOT'?'hot':'';const has=/^https?:\/\//.test(p.url);
    html+='<tr class="'+rc+' '+(has?'clk':'')+'" '+(has?'onclick="openRow(\''+esc(p.url)+'\')"':'')+'><td class="co">'+esc(p.co)+(has?' <span class="lk">\u2197</span>':'')+'</td><td>'+esc(p.role)+'</td><td>'+chip(p.stage)+'</td><td><span class="heat" style="color:'+hc+'">'+((p.heat&&p.heat!=='\u2014')?esc(p.heat):'')+'</span></td><td class="note">'+esc(p.note)+'</td><td class="mono sub">'+esc(p.date)+'</td></tr>';});
  html+='</tbody></table></div>';
  if(closedPos.length){html+='<div style="padding:7px 11px"><div class="lbl" style="margin-bottom:4px">closed / rejected</div><div class="tw"><table><tbody>';
    closedPos.forEach(function(p){html+='<tr><td class="co" style="color:var(--faint)">'+esc(p.co)+'</td><td class="sub">'+esc(p.role)+'</td><td class="mono sub" style="text-align:right">'+esc(p.date)+'</td></tr>';});
    html+='</tbody></table></div></div>';}
  html+='</div></div>';

  // TASK BOARD — clickable to modal
  html+='<div class="panel"><div class="ph"><span class="pt">TASK BOARD</span><div style="display:flex;gap:4px;flex-wrap:wrap">';
  ["all","urgent","held","open","done"].forEach(function(f){html+='<button class="filt '+(FILTER===f?'on':'')+'" onclick="setFilter(\''+f+'\')">'+f+((f!=="all"&&f!=="done")?" "+(counts[f]||0):"")+'</button>';});
  html+='</div></div><div class="pb flush"><div class="ph" style="border:none;padding:5px 11px 0"><span class="sub">click a row for full detail + AI work status</span></div><div class="tw"><table>';
  html+='<thead><tr><th>ID</th><th>Task</th><th>Owner</th><th>Status</th><th>Detail</th></tr></thead><tbody>';
  if(shown.length)shown.forEach(function(t,i){const rc=t.state==='urgent'?'urgent':'';const gi=shownIdx[i];
    html+='<tr class="'+rc+' clk" onclick="showTask('+gi+')"><td class="mono" style="font-weight:700;white-space:nowrap">'+esc(t.id)+'</td><td style="font-weight:600">'+esc(t.name)+'</td><td class="sub">'+esc(t.owner)+'</td><td>'+chip(t.state)+'</td><td class="note">'+esc((t.note||"").slice(0,60))+((t.note||"").length>60?'\u2026':'')+(t.fore?'<div class="fore">\u2691</div>':'')+'</td></tr>';});
  else html+='<tr><td colspan="5" class="sub" style="padding:9px 11px">none in view</td></tr>';
  html+='</tbody></table></div></div></div>';

  html+='<div class="panel"><div class="ph"><span class="pt">IDEAS &amp; GRADING</span></div><div class="pb"><div style="display:flex;flex-direction:column;gap:5px">';
  const subs=d.ideas.filter(function(i){return i.title&&i.title!=="\u2014";});

  else html+='<div style="color:var(--faint);font-size:11px">awaiting idea submissions</div>';
  d.ideas.filter(function(i){return !i.title||i.title==="\u2014";}).forEach(function(i){html+='<div style="font-size:10px;color:var(--faint)">'+esc(i.node)+' \u2014 awaiting submission</div>';});
  html+='<div class="hair"></div><div class="lbl" style="margin-bottom:2px">grading</div><div style="font-size:10px;color:var(--dim);line-height:1.35">'+esc(d.grading||"awaiting peer grades")+'</div></div></div>';

  if(d.schedule.length){html+='<div class="panel"><div class="ph"><span class="pt">SCHEDULED \u00B7 PER NODE</span></div><div class="pb flush"><div class="tw"><table><tbody>';
    d.schedule.forEach(function(s){html+='<tr><td class="mono co" style="color:var(--dim)">'+esc(s.who)+'</td><td class="sub" style="font-size:10.5px">'+esc(s.when)+'</td></tr>';});
    html+='</tbody></table></div></div></div>';}

  if(d.watch.length){html+='<div class="panel"><div class="ph"><span class="pt">WATCH</span><span style="font-size:9.5px;color:var(--faint)">'+d.watch.length+'</span></div><div class="pb"><div style="display:flex;flex-direction:column;gap:4px">';
    d.watch.forEach(function(w){const c=/GATE|CRITICAL|BLOCKER/i.test(w);html+='<div style="display:flex;gap:6px;font-size:10px;color:'+(c?'var(--warn)':'var(--dim)')+';line-height:1.35"><span aria-hidden style="color:'+(c?'var(--nok)':'var(--faint)')+'">'+(c?"\u25B2":"\u00B7")+'</span><span>'+esc(w)+'</span></div>';});
    html+='</div></div></div>';}

  html+='<div style="text-align:center;font-size:9px;color:var(--faint);line-height:1.5;margin-top:4px">tables \u00B7 rows click to JD / task detail \u00B7 verified links only</div>';
  document.getElementById("app").innerHTML=html;
}
